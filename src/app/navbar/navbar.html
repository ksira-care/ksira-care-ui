<header class="navbar">
    <div class="logo">
        <div class="logo-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 22h20L12 2z" fill="white" />
                <path d="M12 7v10m-5-5h10" stroke="#007bb5" stroke-width="2" stroke-linecap="round" />
            </svg>
        </div>
        <a href="/">Ksira<span class="highlight">Care</span></a>
    </div>

    <!-- Center Links -->
    <ul class="nav-links" [class.active]="isMenuOpen()">
        <li><a href="#">Services</a></li>
        <li><a href="#">Hospitals</a></li>
        <li><a href="#">Doctors</a></li>
        <li><a href="#">Treatments</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

    <!-- Right Actions -->
    <div class="nav-actions">
        <button class="btn btn-outline" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                    d="M1.885.511a1.745 1.745 0 0 1 2.61.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.68.68 0 0 0 .178.643l2.457 2.457a.68.68 0 0 0 .644.178l2.189-.547a1.745 1.745 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.6 18.6 0 0 1-7.01-4.42 18.6 18.6 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877z" />
            </svg>
            Call Us
        </button>
        <button class="btn btn-solid" type="button">Book Free Consultation</button>
    </div>

    <!-- Mobile menu toggle -->
    <div class="menu-toggle" (click)="toggleNavbar()">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
    </div>
</header>
