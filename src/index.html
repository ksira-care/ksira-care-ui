<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ksira Care — Someone to talk to, any day</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Ksira Care offers calm, one-to-one conversations with a listening companion. A rough day, a happy one, or something in between — talk openly and be heard. ₹899 per 60-minute session."
    />
    <meta name="theme-color" content="#1f4d35" />

    <!-- ── Favicon — branded SVG heart logo ──────────
         SVG listed first: modern browsers (Chrome, Firefox,
         Safari 12+) use it. The .ico fallback covers Edge
         legacy and very old browsers.
         The <link> tag overrides the browser's automatic
         /favicon.ico request in all modern browsers.
    ─────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml"   href="favicon.svg" />
    <link rel="icon" type="image/x-icon"    href="favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon"            href="favicon.svg" />

    <!-- ── Open Graph ───────────────────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="Ksira Care — Someone to talk to, any day" />
    <meta property="og:description" content="A quiet place to be heard — on good days, hard days, and everything in between." />
    <meta property="og:url"         content="https://ksiracare.example" />

    <!-- ── Twitter card ────────────────────────────── -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="Ksira Care — Someone to talk to, any day" />
    <meta name="twitter:description" content="A quiet place to be heard — on good days, hard days, and everything in between." />

    <!-- ── Fonts — Nunito (rounded, matches Lovable feel) ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <app-root></app-root>
  </body>
</html>
