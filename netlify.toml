# Netlify: builds the site and serves it at ksiracare.com.

[build]
  command = "npm run build"
  publish = "dist/ksira-wellness-app/browser"

[build.environment]
  NODE_VERSION = "22"

# The therapist portal's API lives on Render but is reached through this domain, so the
# session cookie stays first-party (Safari blocks third-party cookies) and no CORS is needed.
# Change the host if the Render service has a different name.
[[redirects]]
  from = "/api/*"
  to = "https://ksira-care-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Single-page app: every other path (e.g. /therapist/login on refresh) loads index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Build output file names carry a content hash, so they can be cached forever.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
